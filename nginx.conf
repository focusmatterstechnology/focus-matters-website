server {
  listen 80;
  server_name _;

  location / {
    proxy_pass https://focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_set_header Host focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_redirect https://focus-matters-hub-recreated.shelby264817.chatgpt.site/ https://www.focusmatters.net/;
    proxy_hide_header Set-Cookie;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
