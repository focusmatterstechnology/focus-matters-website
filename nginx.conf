server {
  listen 80;
  server_name _;

  location / {
    proxy_pass https://focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_set_header Host focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_redirect https://focus-matters-hub-recreated.shelby264817.chatgpt.site/ https://www.focusmatters.net/;
    proxy_hide_header Set-Cookie;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  location ^~ /_next/static/ {
    proxy_pass https://focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_set_header Host focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location ~* ^/(images/.*\.(?:avif|webp|png|jpe?g|svg)|og\.(?:png|jpe?g|webp)|favicon\.(?:ico|svg))$ {
    proxy_pass https://focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_set_header Host focus-matters-hub-recreated.shelby264817.chatgpt.site;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=86400" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:;" always;
}
